packages:
  - apps/*
  - packages/*
  - tests

allowBuilds:
  bcrypt: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

minimumReleaseAgeExclude:
  - "@types/react-dom@19.3.0"
  - "@types/react@19.3.0"
  - eslint-plugin-vue@10.11.1

packageExtensions:
  drizzle-kit:
    dependencies:
      postgres: "3.4.9"
